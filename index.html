<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shakthinathan AI</title>
    <style>
        :root {
            --background-color: #1a1a1a;
            --text-color: #e0e0e0;
            --input-bg-color: #2a2a2a;
            --button-bg-color: #4a4a4a;
            --button-hover-bg: #6a6a6a;
            --user-message-bg: #005090; /* Dark blue */
            --ai-message-bg: #333333;
            --border-color: #444;
            --accent-color: #1e90ff; /* Dodger blue */
            --error-color: #ff4d4d;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            font-family: var(--font-family);
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 800px; /* Limit width for better readability */
            margin: 0 auto; /* Center the container */
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            background-color: #202020; /* Slightly lighter background for the app area */
        }

        header {
            background-color: #252525;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 1.8em;
            font-weight: 600;
        }

        #chatbox {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px; /* Spacing between messages */
        }

        .message {
            padding: 12px 18px;
            border-radius: 18px;
            max-width: 85%; /* Max width of message bubble */
            word-wrap: break-word; /* Prevent long words from overflowing */
            position: relative; /* For potential future additions like timestamps */
        }
         /* Use paragraphs inside messages for better structure */
        .message p {
           margin: 0; /* Remove default paragraph margin */
           padding: 0;
        }
        .message p:not(:last-child) {
             margin-bottom: 8px; /* Add space between paragraphs if needed */
        }


        .user-message {
            background-color: var(--user-message-bg);
            color: #fff;
            align-self: flex-end; /* Align user messages to the right */
            border-bottom-right-radius: 5px; /* Slight style variation */
        }

        .ai-message {
            background-color: var(--ai-message-bg);
            align-self: flex-start; /* Align AI messages to the left */
            border-bottom-left-radius: 5px; /* Slight style variation */
        }

        .ai-message.loading .content::after { /* Target content span for cursor */
            content: '▋'; /* Blinking cursor simulation */
            display: inline-block;
            animation: blink 1s infinite step-start;
            margin-left: 5px;
            font-weight: bold;
        }
         /* Add a span to hold the content, so loading state doesn't overwrite structure */
        .message .content {
            display: inline; /* Or block if needed */
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .error-message {
            background-color: var(--error-color);
            color: white;
            font-weight: bold;
            align-self: center; /* Center error messages */
            max-width: 90%;
            text-align: center;
            border-radius: 5px; /* Simpler radius for errors */
        }

        #input-area {
            display: flex;
            padding: 15px 20px;
            border-top: 1px solid var(--border-color);
            background-color: #252525; /* Match header background */
            gap: 10px; /* Space between textarea and button */
        }

        #userInput {
            flex-grow: 1;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 20px; /* Rounded input field */
            background-color: var(--input-bg-color);
            color: var(--text-color);
            font-family: inherit;
            font-size: 1em;
            resize: none; /* Prevent manual resizing */
            min-height: 48px; /* Ensure minimum height */
            max-height: 150px; /* Limit expansion */
            overflow-y: auto;
            line-height: 1.4; /* Adjust line height for textarea */
        }

        #userInput:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 5px rgba(30, 144, 255, 0.5); /* Subtle glow on focus */
        }

        #sendButton {
            padding: 0 20px; /* Padding for button text */
            border: none;
            border-radius: 20px; /* Match input field rounding */
            background-color: var(--button-bg-color);
            color: var(--text-color);
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.2s ease;
            min-height: 48px; /* Match input field height */
            align-self: flex-end; /* Align with bottom of textarea if it grows */
        }

        #sendButton:hover:not(:disabled) {
            background-color: var(--button-hover-bg);
        }
        #sendButton:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .generated-image-container {
            margin-top: 10px;
        }
        .generated-image-container .loading-text {
            font-style: italic;
            font-size: 0.9em;
            color: #aaa; /* Lighter text for loading */
        }
        .generated-image {
            max-width: 100%; /* Ensure image fits within message bubble */
            max-height: 400px; /* Limit image height */
            border-radius: 10px; /* Rounded corners for images */
            display: none; /* Hide initially */
             margin-top: 5px;
        }
        .generated-image-container .error-text {
            color: var(--error-color);
            font-size: 0.9em;
        }


        /* Scrollbar styling (optional, for better aesthetics) */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--input-bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--button-bg-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--button-hover-bg);
        }

    </style>
</head>
<body>
    <div id="app-container">
        <header>
            <h1>Shakthinathan AI</h1>
        </header>

        <div id="chatbox">
            <!-- Chat messages will be appended here -->
            <div class="message ai-message"><span class="content">Hello! I'm Shakthinathan AI. Ask me anything or type '/image [your prompt]' to generate an image.</span></div>
        </div>

        <form id="input-area">
            <textarea id="userInput" placeholder="Type your message or /image prompt..." rows="1"></textarea>
            <button id="sendButton" type="submit">Send</button>
        </form>
    </div>

    <script>
        const chatbox = document.getElementById('chatbox');
        const userInput = document.getElementById('userInput');
        const inputForm = document.getElementById('input-area');
        const sendButton = document.getElementById('sendButton');

        // --- API Configuration ---
        // WARNING: Exposing API keys in client-side code is insecure!
        // These keys can be easily stolen. Use a backend proxy for production.
        const grokApiConfig = {
            // Ensure this Base URL is correct and includes the schema (https://)
            baseUrl: 'https://oa-grok.host.sdk.li/v1',
            apiKey: 'sk-vinaynoob', // Provided key
            model: 'grok-3-fast' // Using fast model
        };

        const imageApiConfig = {
             // Ensure this Base URL is correct and includes the schema (https://)
            baseUrl: 'https://inferrence.mcpcore.xyz/v1',
            apiKey: 'sk-mcpcore_e7f6YrK9p2Lm8xZq!WbT5sJn3gDv6c', // Provided key
            model: 'gpt-image-1' // As per example
        };
        // --- End API Configuration ---

        let conversationHistory = [
            { role: "system", content: "You are Shakthinathan AI, a helpful assistant." }
        ];

        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = `${userInput.scrollHeight}px`;
        });

        inputForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const userText = userInput.value.trim();
            if (!userText) return;

            addMessage(userText, 'user');
            conversationHistory.push({ role: "user", content: userText });
            userInput.value = '';
            userInput.style.height = 'auto';
            sendButton.disabled = true;
            scrollChatToBottom();

            if (userText.toLowerCase().startsWith('/image ')) {
                const prompt = userText.substring(7).trim();
                if (prompt) {
                    await handleImageGeneration(prompt);
                } else {
                    addMessage("Please provide a prompt after /image.", 'ai', true); // Error specific message
                }
            } else {
                await handleTextGeneration();
            }

            sendButton.disabled = false;
            userInput.focus();
        });

        userInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                inputForm.requestSubmit();
            }
        });

        function addMessage(text, sender, isError = false) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message');

            if (isError) {
                messageElement.classList.add('error-message');
                messageElement.textContent = text; // Direct text for simple errors
            } else {
                messageElement.classList.add(`${sender}-message`);
                // Use a span for content to handle loading indicators better
                const contentSpan = document.createElement('span');
                contentSpan.classList.add('content');
                contentSpan.textContent = text;
                messageElement.appendChild(contentSpan);
            }

            chatbox.appendChild(messageElement);
            scrollChatToBottom();
            return messageElement; // Return element for updates (streaming, image loading)
        }


        function addImageMessage(prompt, sender) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', `${sender}-message`);

            const promptText = document.createElement('p');
            promptText.textContent = `Generating image for: "${prompt}"`;
            messageElement.appendChild(promptText);

            const imageContainer = document.createElement('div');
            imageContainer.classList.add('generated-image-container');

            const loadingText = document.createElement('p');
            loadingText.classList.add('loading-text');
            loadingText.textContent = 'Generating...';
            imageContainer.appendChild(loadingText);

            const imgElement = document.createElement('img');
            imgElement.classList.add('generated-image');
            imgElement.alt = prompt; // Set alt text
            imageContainer.appendChild(imgElement);

            const errorText = document.createElement('p');
             errorText.classList.add('error-text');
             imageContainer.appendChild(errorText); // Add error placeholder

            messageElement.appendChild(imageContainer);
            chatbox.appendChild(messageElement);
            scrollChatToBottom();

            // Return elements needed for updates
            return { messageElement, imgElement, loadingText, errorText };
        }


        function scrollChatToBottom() {
            // Added a small delay to allow the DOM to update heights before scrolling
            setTimeout(() => {
                chatbox.scrollTop = chatbox.scrollHeight;
            }, 50);
        }

        async function handleTextGeneration() {
            // Add placeholder AI message with loading state
            const aiMessageElement = addMessage("", 'ai');
            const contentSpan = aiMessageElement.querySelector('.content'); // Get the content span
            aiMessageElement.classList.add('loading');

            try {
                console.log("Fetching Grok API:", `${grokApiConfig.baseUrl}/chat/completions`);
                const response = await fetch(`${grokApiConfig.baseUrl}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${grokApiConfig.apiKey}`
                    },
                    body: JSON.stringify({
                        model: grokApiConfig.model,
                        messages: conversationHistory,
                        stream: true
                    })
                });

                 console.log("Grok Response Status:", response.status);

                if (!response.ok) {
                    let errorBody = `API Error (${response.status}): ${response.statusText}`;
                    try {
                        // Try to get more specific error from response body
                        const errorData = await response.json();
                         errorBody = `API Error (${response.status}): ${errorData.detail || errorData.error?.message || response.statusText}`;
                         console.error("API Error Body:", errorData);
                    } catch (e) {
                         console.error("Could not parse error response body:", e);
                    }
                    throw new Error(errorBody);
                }

                // --- Streaming Logic ---
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullResponse = "";
                let buffer = "";
                contentSpan.textContent = ''; // Clear placeholder text
                aiMessageElement.classList.remove('loading'); // Remove loading class, but text updates will show activity

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // Keep incomplete line

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const dataContent = line.substring(6).trim();
                            if (dataContent === '[DONE]') {
                                break;
                            }
                            try {
                                const chunk = JSON.parse(dataContent);
                                if (chunk.choices && chunk.choices[0]?.delta?.content) {
                                    const contentPart = chunk.choices[0].delta.content;
                                    fullResponse += contentPart;
                                    contentSpan.textContent += contentPart; // Append to content span
                                    scrollChatToBottom();
                                }
                            } catch (parseError) {
                                console.warn("Could not parse stream chunk:", dataContent, parseError);
                            }
                        }
                    }
                     if (line.startsWith('data: ') && line.substring(6).trim() === '[DONE]') break; // Exit outer loop if DONE received
                }
                // --- End Streaming Logic ---

                if (fullResponse) {
                    conversationHistory.push({ role: "assistant", content: fullResponse });
                } else if (contentSpan.textContent === '') {
                    // Handle cases where the stream might end without content (though unlikely with LLMs)
                     contentSpan.textContent = "[Received empty response]";
                }

            } catch (error) {
                console.error("Text Generation Fetch Error:", error);
                 // Check if the error message indicates a network issue (often CORS)
                 let displayError = `Error: ${error.message}`;
                 if (error instanceof TypeError && error.message.includes("fetch")) {
                     displayError += "\n(This might be a CORS issue or network problem. Check the browser console for details.)";
                     console.error("Detailed Fetch Error:", error); // Log the full error object
                 }
                 // Update the placeholder element with a proper error message
                 aiMessageElement.innerHTML = ''; // Clear existing content/spinner
                 aiMessageElement.classList.remove('loading', 'ai-message');
                 aiMessageElement.classList.add('error-message');
                 aiMessageElement.textContent = displayError;
                 // Don't add error placeholder to history
            } finally {
                aiMessageElement.classList.remove('loading'); // Ensure loading class is removed
                 scrollChatToBottom(); // Scroll after potential error message resizing
            }
        }


        async function handleImageGeneration(prompt) {
             // Add placeholder message with image loading indicator
            const { messageElement, imgElement, loadingText, errorText } = addImageMessage(prompt, 'ai');

            try {
                 console.log("Fetching Image API:", `${imageApiConfig.baseUrl}/images/generations`);
                const response = await fetch(`${imageApiConfig.baseUrl}/images/generations`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${imageApiConfig.apiKey}`
                    },
                    body: JSON.stringify({
                        model: imageApiConfig.model,
                        prompt: prompt,
                        size: "1024x1024"
                        // n: 1
                    })
                });

                console.log("Image Response Status:", response.status);

                if (!response.ok) {
                    let errorBody = `API Error (${response.status}): ${response.statusText}`;
                    try {
                        const errorData = await response.json();
                        errorBody = `API Error (${response.status}): ${errorData.error?.message || response.statusText}`;
                        console.error("API Error Body:", errorData);
                    } catch (e) {
                         console.error("Could not parse error response body:", e);
                     }
                    throw new Error(errorBody);
                }

                const data = await response.json();
                 console.log("Image API Response Data:", data);


                if (data.data && data.data.length > 0 && data.data[0].url) {
                    const imageUrl = data.data[0].url;

                    // Preload image and display when ready
                    imgElement.onload = () => {
                        loadingText.style.display = 'none'; // Hide loading text
                         errorText.style.display = 'none'; // Hide error text area
                        imgElement.style.display = 'block'; // Show image
                        scrollChatToBottom();
                    };
                    imgElement.onerror = () => {
                        console.error("Failed to load image from URL:", imageUrl);
                         loadingText.style.display = 'none'; // Hide loading text
                         errorText.textContent = "Failed to load generated image.";
                         errorText.style.display = 'block'; // Show error text
                        imgElement.style.display = 'none'; // Keep image hidden
                        scrollChatToBottom();
                    };
                    imgElement.src = imageUrl; // Start loading the image

                    // Optional: Add image generation success to history
                    // conversationHistory.push({ role: "assistant", content: `Generated image for: "${prompt}"` });

                } else {
                    throw new Error("API response did not contain a valid image URL.");
                }

            } catch (error) {
                console.error("Image Generation Fetch Error:", error);
                 let displayError = `Error generating image: ${error.message}`;
                 if (error instanceof TypeError && error.message.includes("fetch")) {
                     displayError += "\n(This might be a CORS issue or network problem. Check the browser console.)";
                      console.error("Detailed Fetch Error:", error); // Log the full error object
                 }
                 loadingText.style.display = 'none'; // Hide loading text
                 errorText.textContent = displayError;
                 errorText.style.display = 'block'; // Show error text
                 imgElement.style.display = 'none'; // Ensure image element is hidden
                 // Optionally restyle the message bubble itself as an error
                 messageElement.classList.remove('ai-message');
                 messageElement.classList.add('error-message'); // You might want a less intrusive error style here though
                 messageElement.style.backgroundColor = 'transparent'; // Avoid double background if using error-message class fully
            }
            // No finally block needed here as UI updates happen via img onload/onerror
        }

         window.onload = () => {
             scrollChatToBottom();
             userInput.focus();
             console.log("Shakthinathan AI Initialized. Waiting for input.");
             console.log("NOTE: If API calls fail with 'Failed to fetch', check the Console for CORS errors. These APIs might not be directly callable from a browser.");
         }
    </script>
</body>
</html>
